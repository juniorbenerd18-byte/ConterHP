<style>
/* ============================================
   COUNTER HP - PROFESSIONAL REDESIGN
   Blue & White Modern Theme
   ============================================ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

/* ============================================
   CSS VARIABLES
   ============================================ */
:root {
    --primary:       #2563EB;
    --primary-dark:  #1D4ED8;
    --primary-light: #DBEAFE;
    --primary-soft:  #EFF6FF;

    --white:      #FFFFFF;
    --background: #F8FAFC;
    --surface:    #FFFFFF;

    --border:       #E2E8F0;
    --border-light: #F1F5F9;

    --text:           #1E293B;
    --text-secondary: #64748B;
    --text-muted:     #94A3B8;

    --success: #10B981;
    --warning: #F59E0B;
    --danger:  #EF4444;
    --info:    #3B82F6;

    --space-4:  4px;
    --space-8:  8px;
    --space-12: 12px;
    --space-16: 16px;
    --space-24: 24px;
    --space-32: 32px;
    --space-48: 48px;

    --radius-4:  4px;
    --radius-8:  8px;
    --radius-12: 12px;
    --radius-16: 16px;
    --radius-full: 999px;

    --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 6px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 20px rgba(0,0,0,0.08);

    --transition-fast:   0.15s ease;
    --transition-normal: 0.2s ease;
    --transition-slow:   0.3s ease;
}

/* ============================================
   DARK MODE SYSTEM
   ============================================ */
[data-theme="dark"] {
    --primary:       #3B82F6;
    --primary-dark:  #2563EB;
    --primary-light: #1E3A8A;
    --primary-soft:  rgba(59, 130, 246, 0.15);

    --white:      #1E293B;
    --background: #0F172A;
    --surface:    #1E293B;

    --border:       #334155;
    --border-light: #1E293B;

    --text:           #F8FAFC;
    --text-secondary: #94A3B8;
    --text-muted:     #64748B;

    --shadow-xs: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-sm: 0 2px 4px rgba(0,0,0,0.5);
    --shadow-md: 0 4px 10px rgba(0,0,0,0.5);
    --shadow-lg: 0 10px 25px rgba(0,0,0,0.6);
}

/* Dark Mode Overrides */
[data-theme="dark"] body {
    background-color: var(--background);
    color: var(--text);
}

[data-theme="dark"] .login-card {
    background: rgba(30, 41, 59, 0.95);
    border: 1px solid var(--border);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
}

[data-theme="dark"] .login-title { color: #F8FAFC; }

[data-theme="dark"] .app-header,
[data-theme="dark"] .summary-dashboard,
[data-theme="dark"] .tabs {
    background: #1E293B;
    border-color: #334155;
}

[data-theme="dark"] .dashboard-welcome {
    background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
    border-color: #334155;
}
[data-theme="dark"] .dashboard-title { color: #60A5FA; }
[data-theme="dark"] .dashboard-subtitle { color: #93C5FD; }
[data-theme="dark"] .dash-quick-link {
    background: #1E293B;
    border-color: #334155;
    color: #60A5FA;
}
[data-theme="dark"] .dash-quick-link:hover {
    background: #3B82F6;
    color: white;
    border-color: #3B82F6;
}

[data-theme="dark"] .dash-stat-blue {
    background: linear-gradient(135deg, #1E3A8A 0%, #172554 100%);
    border-color: #2563EB;
}
[data-theme="dark"] .dash-stat-green {
    background: linear-gradient(135deg, #064E3B 0%, #022C22 100%);
    border-color: #059669;
}
[data-theme="dark"] .dash-stat-yellow {
    background: linear-gradient(135deg, #78350F 0%, #451A03 100%);
    border-color: #D97706;
}
[data-theme="dark"] .dash-stat-label { color: #CBD5E1; }
[data-theme="dark"] .dash-stat-value { color: #F8FAFC; }

[data-theme="dark"] .section-heading { color: #60A5FA; }

[data-theme="dark"] .dash-info-box {
    background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
    border-color: #334155;
}
[data-theme="dark"] .dash-info-title { color: #38BDF8; }
[data-theme="dark"] .dash-info-item {
    border-bottom-color: #334155;
    color: #94A3B8;
}
[data-theme="dark"] .dash-info-item strong { color: #F8FAFC; }

[data-theme="dark"] input,
[data-theme="dark"] select,
[data-theme="dark"] textarea {
    background-color: #0F172A;
    color: #F8FAFC;
    border-color: #334155;
}
[data-theme="dark"] input::placeholder,
[data-theme="dark"] textarea::placeholder {
    color: #64748B;
}
[data-theme="dark"] input:focus,
[data-theme="dark"] select:focus,
[data-theme="dark"] textarea:focus {
    border-color: #3B82F6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
}

[data-theme="dark"] .btn-secondary {
    background: #1E293B;
    color: #CBD5E1;
    border-color: #334155;
}
[data-theme="dark"] .btn-secondary:hover {
    background: #334155;
    color: #F8FAFC;
}

[data-theme="dark"] .modal-content,
[data-theme="dark"] .confirm-box {
    background: #1E293B;
    color: #F8FAFC;
    border: 1px solid #334155;
}

[data-theme="dark"] .spec-icon-box,
[data-theme="dark"] .spec-img {
    background: #0F172A;
    border-color: #334155;
}
[data-theme="dark"] .spec-header { border-bottom-color: #334155; }
[data-theme="dark"] .spec-category-badge { background: #334155; color: #CBD5E1; }
[data-theme="dark"] .spec-title,
[data-theme="dark"] .spec-body h3 { color: #F8FAFC; }
[data-theme="dark"] .spec-text {
    background: #0F172A;
    border-color: #334155;
    color: #CBD5E1;
}

[data-theme="dark"] .btn-show-desc {
    background: rgba(59, 130, 246, 0.15);
    color: #60A5FA;
    border-color: #2563EB;
}
[data-theme="dark"] .btn-show-desc:hover {
    background: #3B82F6;
    color: #FFFFFF;
}

[data-theme="dark"] .chart-panel {
    background: #1E293B;
    border-color: #334155;
}
[data-theme="dark"] .chart-panel h3 {
    color: #F8FAFC;
    border-bottom-color: #334155;
}
[data-theme="dark"] .chart-item-name { color: #F8FAFC; }

[data-theme="dark"] .toast {
    background: #1E293B;
    border-color: #334155;
    color: #F8FAFC;
}

[data-theme="dark"] .header-user-info {
    background: #0F172A;
    border-color: #334155;
}

[data-theme="dark"] .btn-header-icon {
    background: #1E293B;
    border-color: #334155;
    color: #F8FAFC;
}
[data-theme="dark"] .btn-header-icon:hover {
    background: #334155;
    border-color: #3B82F6;
}

[data-theme="dark"] .produk-toolbar,
[data-theme="dark"] .produk-table-wrap {
    background: #1E293B;
    border-color: #334155;
}
[data-theme="dark"] .produk-table th { color: #60A5FA; }
[data-theme="dark"] .produk-table td {
    border-bottom-color: #334155;
    color: #F8FAFC;
}
[data-theme="dark"] .produk-table tbody tr:hover {
    background: #0F172A;
}

[data-theme="dark"] .payment-modal-summary {
    background: rgba(59, 130, 246, 0.15);
    border-color: #2563EB;
}
[data-theme="dark"] .payment-modal-label { color: #93C5FD; }

[data-theme="dark"] .receipt-header,
[data-theme="dark"] .receipt-footer { border-color: #334155; }

[data-theme="dark"] .btn-confirm-no {
    background: #0F172A;
    color: #CBD5E1;
    border-color: #334155;
}
[data-theme="dark"] .btn-confirm-no:hover { background: #334155; }

/* Login screen theme toggle button */
.login-theme-toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #FFFFFF;
    font-size: 20px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition-fast);
    z-index: 10;
}
.login-theme-toggle:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: scale(1.08);
}

/* ============================================
   LOGIN SCREEN
   ============================================ */
.login-screen {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 50%, #2563EB 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* Animated background circles */
.login-screen::before,
.login-screen::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.03);
    animation: loginFloat 8s ease-in-out infinite;
}
.login-screen::before {
    width: 500px; height: 500px;
    top: -200px; right: -100px;
}
.login-screen::after {
    width: 350px; height: 350px;
    bottom: -150px; left: -50px;
    animation-delay: -4s;
}

@keyframes loginFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50%       { transform: translateY(-20px) scale(1.05); }
}

.login-card {
    background: rgba(255,255,255,0.97);
    border-radius: 24px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    position: relative;
    z-index: 1;
    animation: modalSlideIn 0.4s ease;
}

.login-header {
    text-align: center;
    margin-bottom: 36px;
}

.login-logo {
    font-size: 52px;
    margin-bottom: 16px;
    line-height: 1;
    filter: drop-shadow(0 4px 8px rgba(37,99,235,0.3));
}

.login-title {
    font-size: 22px;
    font-weight: 800;
    color: #1E293B;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
}

.login-subtitle {
    font-size: 14px;
    color: var(--text-secondary);
}

.login-form { display: flex; flex-direction: column; gap: 18px; }

.login-field label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
}

.login-field input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-8);
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    transition: all var(--transition-fast);
}
.login-field input::placeholder { color: var(--text-muted); }
.login-field input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
}

.login-pw-wrap {
    position: relative;
}
.login-pw-wrap input { padding-right: 48px; }

.login-pw-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    padding: 4px;
    line-height: 1;
}

.login-error {
    font-size: 13px;
    font-weight: 600;
    color: var(--danger);
    background: #FEE2E2;
    border: 1px solid #FECACA;
    border-radius: var(--radius-8);
    padding: 10px 14px;
    margin: 0;
    text-align: center;
}

.login-btn {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: var(--radius-8);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition-normal);
    font-family: inherit;
    letter-spacing: 0.3px;
}
.login-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
}

.login-hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border-light);
}

/* ============================================
   HEADER - Auth elements
   ============================================ */
.header-actions {
    display: flex;
    align-items: center;
    gap: var(--space-8);
}

.header-user-info {
    display: flex;
    align-items: center;
    gap: var(--space-8);
    padding: 6px 14px;
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: var(--radius-full);
}

.header-role-badge {
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: var(--radius-full);
}
.role-admin {
    background: linear-gradient(135deg, #FEF3C7, #FDE68A);
    color: #92400E;
    border: 1px solid #FCD34D;
}
.role-user {
    background: var(--primary-soft);
    color: var(--primary);
    border: 1px solid var(--primary-light);
}

.header-user-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.btn-header-icon {
    width: 38px;
    height: 38px;
    border: 1px solid var(--border);
    background: var(--white);
    border-radius: var(--radius-8);
    font-size: 18px;
    cursor: pointer;
    transition: all var(--transition-fast);
    display: flex;
    align-items: center;
    justify-content: center;
}
.btn-header-icon:hover {
    background: var(--background);
    border-color: var(--primary);
}

.btn-logout {
    display: flex;
    align-items: center;
    gap: var(--space-8);
    background: #FEE2E2;
    color: #DC2626;
    border: 1px solid #FECACA;
    padding: 8px 16px;
    border-radius: var(--radius-8);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition-fast);
    font-family: inherit;
    white-space: nowrap;
}
.btn-logout:hover { background: var(--danger); color: white; border-color: var(--danger); }

/* ============================================
   SETTINGS MODAL
   ============================================ */
.settings-section {
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: var(--radius-12);
    padding: var(--space-16);
}

.settings-section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: var(--space-16);
    padding-bottom: var(--space-8);
    border-bottom: 1px solid var(--border);
}

/* ============================================
   RESET
   ============================================ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html {
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--background);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
}

/* ============================================
   TOAST NOTIFICATIONS
   ============================================ */
.toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
}

.toast {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-12);
    padding: 14px 16px;
    min-width: 280px;
    max-width: 360px;
    box-shadow: var(--shadow-lg);
    pointer-events: all;
    opacity: 0;
    transform: translateX(20px);
    transition: all 0.3s ease;
    border-left: 4px solid var(--primary);
}

.toast.show {
    opacity: 1;
    transform: translateX(0);
}

.toast-success { border-left-color: var(--success); }
.toast-error   { border-left-color: var(--danger);  }
.toast-warning { border-left-color: var(--warning); }
.toast-info    { border-left-color: var(--info);    }

.toast-icon { font-size: 18px; flex-shrink: 0; }

.toast-message {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
}

.toast-close {
    background: none;
    border: none;
    font-size: 18px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
    flex-shrink: 0;
}
.toast-close:hover { color: var(--text); }

/* ============================================
   CUSTOM CONFIRM DIALOG
   ============================================ */
.confirm-overlay {
    position: fixed;
    inset: 0;
    z-index: 8000;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
}

.confirm-box {
    background: var(--white);
    border-radius: var(--radius-16);
    padding: var(--space-32);
    max-width: 400px;
    width: 90%;
    text-align: center;
    box-shadow: var(--shadow-lg);
    animation: modalSlideIn 0.25s ease;
}

.confirm-icon { font-size: 40px; margin-bottom: var(--space-16); }

.confirm-message {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: var(--space-24);
    line-height: 1.5;
    white-space: pre-line;
}

.confirm-actions {
    display: flex;
    gap: var(--space-12);
}

.btn-confirm-no,
.btn-confirm-yes {
    flex: 1;
    padding: var(--space-12) var(--space-16);
    border-radius: var(--radius-8);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all var(--transition-fast);
}

.btn-confirm-no {
    background: var(--background);
    color: var(--text-secondary);
    border: 1px solid var(--border);
}
.btn-confirm-no:hover { background: var(--border-light); }

.btn-confirm-yes {
    background: var(--danger);
    color: var(--white);
}
.btn-confirm-yes:hover { background: #DC2626; }

/* ============================================
   BUSINESS BAR
   ============================================ */
.business-bar {
    background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 60%, #1D4ED8 100%);
    padding: 0 var(--space-32);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: relative;
    overflow: hidden;
}

/* Subtle animated background shimmer */
.business-bar::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
        transparent 0%,
        rgba(255,255,255,0.03) 50%,
        transparent 100%);
    background-size: 200% 100%;
    animation: barShimmer 4s ease-in-out infinite;
}

@keyframes barShimmer {
    0%   { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}

.business-bar-container {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-24);
    height: 52px;
    position: relative;
    z-index: 1;
}

/* Identity kiri */
.biz-identity {
    display: flex;
    align-items: center;
    gap: var(--space-12);
    flex-shrink: 0;
}

.biz-logo-wrap {
    width: 32px;
    height: 32px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: var(--radius-8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}

.biz-identity-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
}

.biz-name {
    font-size: 13px;
    font-weight: 700;
    color: #FFFFFF;
    letter-spacing: 0.2px;
    line-height: 1.2;
}

.biz-meta {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    font-weight: 500;
    letter-spacing: 0.3px;
}

.biz-status-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.35);
    border-radius: var(--radius-full);
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 700;
    color: #6EE7B7;
    letter-spacing: 0.3px;
}

/* Dot pulse animasi */
.biz-dot-pulse {
    width: 7px;
    height: 7px;
    background: #10B981;
    border-radius: 50%;
    display: inline-block;
    position: relative;
}
.biz-dot-pulse::after {
    content: '';
    position: absolute;
    inset: -3px;
    background: rgba(16,185,129,0.35);
    border-radius: 50%;
    animation: dotPulse 1.8s ease-in-out infinite;
}

@keyframes dotPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50%       { transform: scale(1.5); opacity: 0; }
}

/* Alerts kanan */
.biz-alerts {
    display: flex;
    align-items: center;
    gap: var(--space-8);
    flex-wrap: nowrap;
    overflow: hidden;
}

.biz-alert-item {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 12px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid transparent;
    transition: all var(--transition-fast);
}
.biz-alert-item:hover { transform: translateY(-1px); }

.biz-alert-danger  {
    background: rgba(239,68,68,0.15);
    border-color: rgba(239,68,68,0.3);
    color: #FCA5A5;
}
.biz-alert-warning {
    background: rgba(245,158,11,0.15);
    border-color: rgba(245,158,11,0.3);
    color: #FCD34D;
}
.biz-alert-info    {
    background: rgba(59,130,246,0.2);
    border-color: rgba(59,130,246,0.35);
    color: #93C5FD;
}
.biz-alert-success {
    background: rgba(16,185,129,0.15);
    border-color: rgba(16,185,129,0.3);
    color: #6EE7B7;
}
.biz-alert-neutral {
    background: rgba(255,255,255,0.07);
    border-color: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.6);
}

/* Divider antar alert */
.biz-alerts .biz-alert-item + .biz-alert-item::before {
    content: '';
    width: 1px;
    height: 14px;
    background: rgba(255,255,255,0.15);
    margin-right: var(--space-4);
    flex-shrink: 0;
}

/* ============================================
   HEADER
   ============================================ */
.app-header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: var(--space-24) var(--space-32);
}

.header-container {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-brand {
    display: flex;
    align-items: center;
    gap: var(--space-12);
}

.brand-icon { font-size: 32px; line-height: 1; }

.brand-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
}

.btn-refresh {
    display: flex;
    align-items: center;
    gap: var(--space-8);
    background: var(--primary);
    color: var(--white);
    border: none;
    padding: var(--space-12) var(--space-24);
    border-radius: var(--radius-8);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition-normal);
}
.btn-refresh:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
}

/* ============================================
   SUMMARY DASHBOARD
   ============================================ */
.summary-dashboard {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: var(--space-32);
}

.summary-container {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-24);
}

.summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-12);
    padding: var(--space-24);
    display: flex;
    align-items: flex-start;
    gap: var(--space-16);
    transition: all var(--transition-normal);
}
.summary-card:hover {
    border-color: var(--primary-light);
    box-shadow: var(--shadow-sm);
}

.summary-icon {
    font-size: 28px;
    width: 52px;
    height: 52px;
    background: var(--primary-soft);
    border-radius: var(--radius-12);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.summary-content { flex: 1; min-width: 0; }

.summary-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    margin-bottom: 6px;
}

.summary-value {
    font-size: 26px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 4px;
    line-height: 1.2;
}

.summary-info { font-size: 12px; color: var(--text-muted); }

/* ============================================
   MAIN CONTENT
   ============================================ */
.main-content {
    max-width: 1400px;
    margin: 0 auto;
    padding: var(--space-32);
}

/* ============================================
   NAVIGATION TABS
   ============================================ */
.tabs {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-12);
    padding: var(--space-8);
    display: flex;
    gap: var(--space-4);
    margin-bottom: var(--space-32);
    overflow-x: auto;
    scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab-button {
    flex-shrink: 0;
    position: relative;
    padding: var(--space-12) var(--space-24);
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 600;
    border-radius: var(--radius-8);
    cursor: pointer;
    transition: all var(--transition-fast);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
}
.tab-button:hover { background: var(--primary-soft); color: var(--primary); }
.tab-button.active { background: var(--primary); color: var(--white); box-shadow: var(--shadow-sm); }

/* Cart Badge */
.cart-badge {
    min-width: 20px;
    height: 20px;
    background: #EF4444;
    color: white;
    font-size: 11px;
    font-weight: 700;
    border-radius: var(--radius-full);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 5px;
}

/* ============================================
   TAB CONTENT
   ============================================ */
.tab-content { display: none; animation: fadeInUp 0.25s ease; }
.tab-content.active { display: block; }

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ============================================
   DASHBOARD WELCOME - Updated
   ============================================ */
.dashboard-welcome {
    margin-bottom: var(--space-32);
    padding: var(--space-32);
    background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
    border: 1px solid #BFDBFE;
    border-radius: var(--radius-16);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-24);
    flex-wrap: wrap;
}

.dashboard-welcome-left { flex: 1; }

.dashboard-title {
    font-size: 28px;
    font-weight: 800;
    color: #1E3A8A;
    margin-bottom: 8px;
}

.dashboard-subtitle {
    font-size: 14px;
    color: #3B82F6;
}

.dashboard-welcome-right {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.dash-quick-link {
    padding: 8px 16px;
    background: white;
    border: 1.5px solid #BFDBFE;
    border-radius: var(--radius-full);
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    cursor: pointer;
    transition: all var(--transition-fast);
    white-space: nowrap;
}
.dash-quick-link:hover {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    transform: translateY(-1px);
}

/* ============================================
   TAB PRODUK - MANAGEMENT TABLE
   ============================================ */
.produk-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: var(--space-24);
    gap: var(--space-16);
    flex-wrap: wrap;
}

.produk-header h2 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
}

.btn-add-product {
    padding: 12px 24px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: var(--radius-8);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition-normal);
    white-space: nowrap;
    font-family: inherit;
}
.btn-add-product:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
}

.produk-toolbar {
    display: flex;
    gap: var(--space-16);
    align-items: center;
    margin-bottom: var(--space-20, 20px);
    flex-wrap: wrap;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-12);
    padding: var(--space-16);
}

.produk-filter-btns {
    display: flex;
    gap: var(--space-8);
    flex-wrap: wrap;
    flex-shrink: 0;
}

.produk-table-wrap {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-16);
    overflow: hidden;
    overflow-x: auto;
}

.produk-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

.produk-table thead tr {
    background: var(--primary-soft);
    border-bottom: 2px solid var(--primary-light);
}

.produk-table th {
    padding: 14px 16px;
    text-align: left;
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    white-space: nowrap;
}

.produk-table td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-light);
    color: var(--text);
    vertical-align: middle;
}

.produk-table tbody tr:last-child td { border-bottom: none; }
.produk-table tbody tr:hover { background: var(--background); }

.produk-table-img {
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: var(--radius-8);
    display: block;
}

.produk-table-icon {
    width: 40px;
    height: 40px;
    background: var(--primary-soft);
    border-radius: var(--radius-8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}

.produk-name-cell { font-weight: 600; color: var(--text); }
.produk-price-cell { font-weight: 700; color: var(--primary); }

.category-pill {
    padding: 3px 10px;
    background: var(--primary-soft);
    color: var(--primary);
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
}

.produk-action-cell {
    display: flex;
    gap: 6px;
    align-items: center;
}

.btn-produk-edit, .btn-produk-delete {
    padding: 6px 14px;
    border: none;
    border-radius: var(--radius-8);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition-fast);
    font-family: inherit;
    white-space: nowrap;
}

.btn-produk-edit   { background: var(--primary-soft); color: var(--primary); border: 1px solid var(--primary-light); }
.btn-produk-edit:hover   { background: var(--primary); color: white; }
.btn-produk-delete { background: #FEE2E2; color: #DC2626; border: 1px solid #FECACA; }
.btn-produk-delete:hover { background: var(--danger); color: white; }

/* Modal produk */
.modal-product { max-width: 720px; }

/* Layout 2 kolom modal produk */
.product-modal-layout {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: var(--space-24);
    margin-top: var(--space-8);
}

.product-modal-photo-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
}

.product-modal-img-preview {
    width: 100%;
    aspect-ratio: 1;
    background: var(--background);
    border: 2px dashed var(--border);
    border-radius: var(--radius-12);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.product-modal-img-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-modal-upload-btn {
    width: 100%;
    padding: 9px 14px;
    background: var(--primary-soft);
    border: 1.5px solid var(--primary-light);
    border-radius: var(--radius-8);
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    cursor: pointer;
    text-align: center;
    transition: all var(--transition-fast);
    display: block;
}
.product-modal-upload-btn:hover { background: var(--primary-light); }

.product-modal-remove-btn {
    width: 100%;
    padding: 8px 14px;
    background: #FEE2E2;
    border: 1px solid #FECACA;
    border-radius: var(--radius-8);
    font-size: 13px;
    font-weight: 600;
    color: #DC2626;
    cursor: pointer;
    transition: all var(--transition-fast);
    font-family: inherit;
}
.product-modal-remove-btn:hover { background: var(--danger); color: white; }

.product-modal-img-hint {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.5;
}

.product-modal-form-col { display: flex; flex-direction: column; }

/* Product card desc */
.product-desc {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.4;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.btn-show-desc {
    background: #EFF6FF;
    color: #2563EB;
    border: 1px solid #BFDBFE;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 6px;
    transition: all var(--transition-fast, 0.2s ease);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    width: fit-content;
    font-family: inherit;
}

.btn-show-desc:hover {
    background: #2563EB;
    color: white;
    border-color: #2563EB;
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
}

/* Modal Spesifikasi Produk */
.modal-spec {
    max-width: 520px;
    border-radius: 16px;
    padding: 24px;
}

.spec-header {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-color, #E5E7EB);
}

.spec-img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid var(--border-color, #E5E7EB);
}

.spec-icon-box {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    background: var(--bg-surface, #F8FAFC);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    border: 1px solid var(--border-color, #E5E7EB);
}

.spec-header-info {
    flex: 1;
    text-align: left;
}

.spec-category-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 12px;
    background: #F1F5F9;
    color: #475569;
    margin-bottom: 6px;
}

.modal-spec .spec-title,
.spec-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-heading, #1E293B);
    margin: 0 0 4px 0;
    text-align: left !important;
}

.spec-price {
    font-size: 16px;
    font-weight: 700;
    color: var(--primary, #2563EB);
    margin-bottom: 4px;
}

.spec-stock {
    font-size: 12px;
    font-weight: 500;
}

.spec-body {
    margin-bottom: 20px;
}

.spec-body h3 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-heading, #1E293B);
    margin-bottom: 8px;
}

.spec-text {
    font-size: 13px;
    color: var(--text-body, #334155);
    line-height: 1.6;
    background: #F8FAFC;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid #E2E8F0;
    max-height: 200px;
    overflow-y: auto;
}

.spec-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
}

@media (max-width: 600px) {
    .product-modal-layout { grid-template-columns: 1fr; }
    .product-modal-photo-col { flex-direction: row; flex-wrap: wrap; }
    .product-modal-img-preview { width: 120px; aspect-ratio: 1; }
}

/* ============================================
   SERVICE CARD - tombol nota
   ============================================ */
.btn-print-nota {
    background: #F0FDF4;
    color: #16A34A;
    border: 1px solid #BBF7D0;
}
.btn-print-nota:hover { background: #16A34A; color: white; }

/* Stats row di dashboard */
.dash-stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-20, 20px);
    margin-bottom: var(--space-32);
}

.dash-stat-card {
    border-radius: var(--radius-16);
    padding: var(--space-24);
    display: flex;
    align-items: center;
    gap: var(--space-16);
    border: 2px solid transparent;
}

.dash-stat-blue   { background: linear-gradient(135deg,#DBEAFE,#BFDBFE); border-color: #93C5FD; }
.dash-stat-green  { background: linear-gradient(135deg,#D1FAE5,#A7F3D0); border-color: #6EE7B7; }
.dash-stat-yellow { background: linear-gradient(135deg,#FEF3C7,#FDE68A); border-color: #FCD34D; }

.dash-stat-icon { font-size: 36px; line-height: 1; }
.dash-stat-label { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #475569; margin-bottom: 4px; }
.dash-stat-value { font-size: 28px; font-weight: 700; color: #1E293B; line-height: 1.1; }

.section-heading {
    font-size: 18px;
    font-weight: 700;
    color: #1E3A8A;
    margin-bottom: var(--space-20, 20px);
    margin-top: var(--space-8);
}

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: var(--space-20, 20px);
    margin-bottom: var(--space-32);
}

.dashboard-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-16);
    padding: var(--space-24);
    cursor: pointer;
    transition: all var(--transition-normal);
}
.dashboard-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
    border-color: var(--primary);
}

.dashboard-card-icon {
    width: 56px;
    height: 56px;
    background: var(--primary);
    border-radius: var(--radius-12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: var(--space-16);
}

.dashboard-card-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: var(--space-8);
}

.dashboard-card-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: var(--space-16);
}

.dashboard-card-cta {
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
}

/* Info Sistem Box */
.dash-info-box {
    background: linear-gradient(135deg,#F0F9FF,#E0F2FE);
    border: 2px solid #BAE6FD;
    border-radius: var(--radius-16);
    padding: var(--space-24);
}

.dash-info-title {
    font-size: 15px;
    font-weight: 700;
    color: #0C4A6E;
    margin-bottom: var(--space-16);
}

.dash-info-grid {
    display: grid;
    gap: 0;
}

.dash-info-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px dashed #7DD3FC;
    font-size: 14px;
    color: #0369A1;
}
.dash-info-item:last-child { border-bottom: none; }
.dash-info-item strong { color: #1E3A8A; font-size: 16px; }

/* ============================================
   CONTENT GRID - PENJUALAN (60/40 balance)
   ============================================ */
.content-grid {
    display: grid;
    grid-template-columns: 1fr 400px;
    gap: var(--space-24);
}

.left-panel,
.right-panel {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-16);
    padding: var(--space-24);
}

.left-panel h2,
.right-panel h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: var(--space-20, 20px);
    padding-bottom: var(--space-12);
    border-bottom: 2px solid var(--border-light);
}

/* ============================================
   SEARCH BOX
   ============================================ */
.search-box { margin-bottom: var(--space-16); }

.search-box input {
    width: 100%;
    padding: var(--space-12) var(--space-16) var(--space-12) var(--space-48);
    border: 1px solid var(--border);
    border-radius: var(--radius-8);
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%2364748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>');
    background-repeat: no-repeat;
    background-position: 14px center;
    transition: all var(--transition-normal);
}
.search-box input::placeholder { color: var(--text-muted); }
.search-box input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
}

/* ============================================
   CATEGORY BUTTONS
   ============================================ */
.product-categories {
    display: flex;
    gap: var(--space-8);
    margin-bottom: var(--space-20, 20px);
    flex-wrap: wrap;
}

.category-btn {
    padding: var(--space-8) var(--space-16);
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--text-secondary);
    border-radius: var(--radius-full);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition-fast);
}
.category-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.category-btn.active { background: var(--primary); color: var(--white); border-color: var(--primary); }

/* ============================================
   PRODUCT GRID
   ============================================ */
.product-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: var(--space-12);
    max-height: 580px;
    overflow-y: auto;
    padding-right: 4px;
}

.product-list::-webkit-scrollbar { width: 4px; }
.product-list::-webkit-scrollbar-track { background: var(--border-light); border-radius: 99px; }
.product-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

.product-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-12);
    padding: var(--space-16);
    text-align: center;
    cursor: pointer;
    transition: all var(--transition-normal);
}
.product-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--primary-light);
}

.product-card.out-of-stock {
    opacity: 0.55;
    cursor: not-allowed;
}
.product-card.out-of-stock:hover {
    transform: none;
    box-shadow: none;
    border-color: var(--border);
}

.product-icon { font-size: 44px; margin-bottom: var(--space-8); line-height: 1; }

.product-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: var(--space-8);
    line-height: 1.3;
    min-height: 34px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.product-price {
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 6px;
}

.product-stock {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--background);
    padding: 3px 8px;
    border-radius: var(--radius-4);
    display: inline-block;
}

.stock-low   { background: #FEF3C7; color: #92400E; }
.stock-empty { background: #FEE2E2; color: #991B1B; }

/* ============================================
   CART
   ============================================ */
.cart-items {
    min-height: 260px;
    max-height: 440px;
    overflow-y: auto;
    padding-right: 4px;
    margin-bottom: var(--space-8);
}

.cart-items::-webkit-scrollbar { width: 4px; }
.cart-items::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

.cart-item {
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: var(--radius-8);
    padding: var(--space-12) var(--space-16);
    margin-bottom: var(--space-8);
    transition: all var(--transition-fast);
}
.cart-item:hover { border-color: var(--primary-light); box-shadow: var(--shadow-xs); }

.cart-item-info { margin-bottom: 8px; }

.cart-item-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
}

.cart-item-details {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-8);
    flex-wrap: wrap;
}

.cart-item-price {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
    min-width: 80px;
}

.cart-item-controls {
    display: flex;
    align-items: center;
    gap: 6px;
}

.cart-item-subtotal {
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
    min-width: 80px;
    text-align: right;
}

/* Empty cart CTA */
.cart-empty {
    padding: var(--space-48) var(--space-16);
}
.empty-state-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 6px;
}

.qty-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: var(--primary);
    color: var(--white);
    border-radius: var(--radius-8);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition-fast);
    display: flex;
    align-items: center;
    justify-content: center;
}
.qty-btn:hover { background: var(--primary-dark); transform: scale(1.08); }

.qty-display {
    min-width: 28px;
    text-align: center;
    font-weight: 700;
    color: var(--text);
    font-size: 15px;
}

.remove-btn {
    padding: 5px 8px;
    border: none;
    background: #FEE2E2;
    color: #DC2626;
    border-radius: var(--radius-8);
    font-size: 13px;
    cursor: pointer;
    transition: all var(--transition-fast);
}
.remove-btn:hover { background: var(--danger); color: white; }

/* ============================================
   CART SUMMARY
   ============================================ */
.cart-summary {
    background: var(--primary-soft);
    border: 1px solid var(--primary-light);
    border-radius: var(--radius-12);
    padding: var(--space-20, 20px);
}

.summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--space-8) 0;
    color: var(--text);
    font-weight: 500;
    font-size: 14px;
}

.summary-row input {
    width: 72px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-4);
    text-align: right;
    font-size: 14px;
    font-family: inherit;
    background: var(--white);
}
.summary-row input:focus { outline: none; border-color: var(--primary); }

.summary-divider {
    height: 2px;
    background: var(--primary);
    margin: var(--space-8) 0;
    border-radius: 99px;
}

.summary-row.total {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    padding-top: var(--space-8);
}

.customer-info {
    margin: var(--space-16) 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-8);
}

.customer-info input {
    padding: var(--space-12);
    border: 1px solid var(--border);
    border-radius: var(--radius-8);
    font-size: 14px;
    font-family: inherit;
    background: var(--white);
    transition: all var(--transition-fast);
}
.customer-info input::placeholder { color: var(--text-muted); }
.customer-info input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

/* ============================================
   BUTTONS
   ============================================ */
.btn-primary,
.btn-secondary {
    width: 100%;
    padding: var(--space-14, 14px) var(--space-16);
    border: none;
    border-radius: var(--radius-8);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition-normal);
    margin-top: var(--space-8);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-8);
    font-family: inherit;
}

.btn-primary {
    background: var(--primary);
    color: var(--white);
    box-shadow: var(--shadow-sm);
}
.btn-primary:hover:not(:disabled) {
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
}
.btn-primary:disabled { cursor: not-allowed; }

.btn-secondary {
    background: var(--white);
    color: var(--primary);
    border: 1.5px solid var(--primary);
}
.btn-secondary:hover:not(:disabled) { background: var(--primary-soft); }
.btn-secondary:disabled { cursor: not-allowed; opacity: 0.5; }

.btn-secondary.active {
    background: var(--primary);
    color: var(--white);
}

/* ============================================
   FORMS
   ============================================ */
.service-form,
.service-list {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-16);
    padding: var(--space-32);
    margin-bottom: var(--space-24);
}

.service-form h2,
.service-list h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: var(--space-24);
    padding-bottom: var(--space-12);
    border-bottom: 2px solid var(--border-light);
}

/* 2-column form rows */
.form-row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-16);
}

.form-row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: var(--space-16);
}

.form-group { margin-bottom: var(--space-16); }

.form-group label {
    display: block;
    margin-bottom: var(--space-8);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
}

.required { color: var(--danger); }

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: var(--space-12);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-8);
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    transition: all var(--transition-fast);
}
.form-group input::placeholder,
.form-group textarea::placeholder { color: var(--text-muted); }
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
}

/* Error state untuk form field */
.input-error {
    border-color: var(--danger) !important;
    box-shadow: 0 0 0 3px #FEE2E2 !important;
}

.field-error {
    font-size: 12px;
    color: var(--danger);
    font-weight: 500;
    margin-top: 4px;
    display: block;
}

/* ============================================
   SERVICE CARDS
   ============================================ */
#serviceListItems {
    display: grid;
    gap: var(--space-16);
    max-height: 600px;
    overflow-y: auto;
}

.service-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-left: 4px solid var(--primary);
    border-radius: var(--radius-12);
    padding: var(--space-24);
    transition: all var(--transition-normal);
}
.service-card:hover { box-shadow: var(--shadow-md); transform: translateX(2px); }

.service-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: var(--space-16);
}

.service-nota {
    background: var(--primary);
    color: var(--white);
    padding: 6px var(--space-12);
    border-radius: var(--radius-8);
    font-size: 12px;
    font-weight: 700;
}

.service-status {
    padding: 6px var(--space-12);
    border-radius: var(--radius-8);
    font-size: 12px;
    font-weight: 700;
}
.service-status.Diterima          { background: #FEF3C7; color: #92400E; }
.service-status.Dalam\.Proses     { background: var(--primary-light); color: var(--primary-dark); }
.service-status.Menunggu\.Sparepart { background: #FED7AA; color: #9A3412; }
.service-status.Selesai            { background: #D1FAE5; color: #065F46; }
.service-status.Diambil            { background: var(--border); color: var(--text-secondary); }

.service-info {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-8);
    margin-bottom: var(--space-12);
    font-size: 13px;
    color: var(--text-secondary);
}

.service-info-item strong { color: var(--primary); font-weight: 600; }

.service-actions {
    display: flex;
    gap: var(--space-8);
    margin-top: var(--space-16);
}
.service-actions button {
    flex: 1;
    padding: var(--space-8) var(--space-12);
    border: none;
    border-radius: var(--radius-8);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition-fast);
    font-family: inherit;
}

.btn-update   { background: var(--primary); color: var(--white); }
.btn-update:hover   { background: var(--primary-dark); }
.btn-complete { background: #10B981; color: var(--white); }
.btn-complete:hover { background: #059669; }
.btn-delete   { background: #FEE2E2; color: #DC2626; }
.btn-delete:hover   { background: var(--danger); color: var(--white); }

/* Status Modal Radio Group */
.modal-sm { max-width: 380px; }

.status-radio-group {
    display: flex;
    flex-direction: column;
    gap: var(--space-8);
}

.status-radio-item {
    display: flex;
    align-items: center;
    gap: var(--space-12);
    padding: var(--space-12);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-8);
    cursor: pointer;
    transition: all var(--transition-fast);
}
.status-radio-item:hover { border-color: var(--primary); background: var(--primary-soft); }
.status-radio-item input { accent-color: var(--primary); width: 16px; height: 16px; }

.status-radio-label { font-size: 14px; font-weight: 600; padding: 4px 12px; border-radius: var(--radius-full); }
.status-diterima   { background: #FEF3C7; color: #92400E; }
.status-proses     { background: var(--primary-light); color: var(--primary-dark); }
.status-sparepart  { background: #FED7AA; color: #9A3412; }
.status-selesai    { background: #D1FAE5; color: #065F46; }
.status-diambil    { background: var(--border); color: var(--text-secondary); }

/* ============================================
   PRODUCT CARD - PHOTO SUPPORT
   ============================================ */
.product-card { position: relative; }

.product-img {
    width: 100%;
    height: 100px;
    object-fit: cover;
    border-radius: var(--radius-8);
    margin-bottom: var(--space-8);
    display: block;
}

.product-photo-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 28px;
    height: 28px;
    background: rgba(255,255,255,0.92);
    border: 1px solid var(--border);
    border-radius: var(--radius-full);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    cursor: pointer;
    opacity: 0;
    transition: opacity var(--transition-fast), transform var(--transition-fast);
    box-shadow: var(--shadow-sm);
    z-index: 2;
}
.product-card:hover .product-photo-btn { opacity: 1; transform: scale(1.1); }

/* ============================================
   PHOTO MODAL
   ============================================ */
.modal-photo { max-width: 440px; }

.photo-modal-subtitle {
    text-align: center;
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 600;
    margin-top: -16px;
    margin-bottom: 20px;
}

.photo-preview-box {
    width: 100%;
    min-height: 160px;
    background: var(--background);
    border: 2px dashed var(--border);
    border-radius: var(--radius-12);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    overflow: hidden;
}

.photo-preview-img {
    width: 100%;
    max-height: 220px;
    object-fit: contain;
    border-radius: var(--radius-8);
}

.photo-placeholder {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    padding: 20px;
    line-height: 2;
    font-size: 32px;
}
.photo-placeholder span { display: block; font-size: 13px; margin-top: 4px; }

.photo-upload-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 18px;
    background: var(--primary-soft);
    border: 2px dashed var(--primary-light);
    border-radius: var(--radius-12);
    cursor: pointer;
    transition: all var(--transition-fast);
    margin-bottom: 16px;
}
.photo-upload-area:hover { background: var(--primary-light); border-color: var(--primary); }
.photo-upload-icon { font-size: 28px; }
.photo-upload-text { font-size: 14px; font-weight: 700; color: var(--primary); }
.photo-upload-hint { font-size: 12px; color: var(--text-muted); }

.photo-modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 4px;
}
.photo-modal-actions .btn-primary,
.photo-modal-actions .btn-secondary { margin-top: 0; flex: 1; }

.btn-danger-outline {
    flex: 1;
    padding: 14px 16px;
    border: 1.5px solid var(--danger);
    background: transparent;
    color: var(--danger);
    border-radius: var(--radius-8);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition-fast);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
    margin-top: 0;
}
.btn-danger-outline:hover { background: var(--danger); color: var(--white); }

/* ============================================
   HISTORY - DETAIL LAYOUT
   ============================================ */
.history-item {
    background: var(--white);
    border: 1px solid var(--border);
    border-left: 4px solid var(--primary);
    border-radius: var(--radius-12);
    padding: 0;
    transition: all var(--transition-normal);
    overflow: hidden;
}
.history-item:hover { box-shadow: var(--shadow-md); }

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px 0 20px;
    gap: 12px;
    flex-wrap: wrap;
}

.history-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.history-header-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.history-id {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    font-family: monospace;
}

.history-date { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

.btn-detail-toggle {
    padding: 5px 14px;
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--text-secondary);
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition-fast);
    white-space: nowrap;
    font-family: inherit;
}
.btn-detail-toggle:hover  { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.btn-detail-toggle.active { background: var(--primary); color: var(--white); border-color: var(--primary); }

.history-summary-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px 16px 20px;
    flex-wrap: wrap;
}

.history-customer {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
    min-width: 140px;
}

.history-phone {
    font-weight: 400;
    color: var(--text-secondary);
}

.history-summary-meta {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--background);
    padding: 4px 10px;
    border-radius: var(--radius-full);
    border: 1px solid var(--border);
    white-space: nowrap;
}

.history-total-inline {
    font-size: 16px;
    font-weight: 700;
    color: var(--primary);
    white-space: nowrap;
    margin-left: auto;
}

/* Detail Panel */
.history-detail-panel {
    border-top: 1px solid var(--border-light);
    padding: 20px;
    background: var(--background);
    animation: fadeInUp 0.2s ease;
}

.detail-section { margin-bottom: 20px; }
.detail-section:last-child { margin-bottom: 0; }

.detail-section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
}

/* Items table inside detail */
.detail-items-table {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-8);
    overflow: hidden;
}

.detail-table-head {
    display: grid;
    grid-template-columns: 1fr 50px 100px 100px;
    gap: 8px;
    padding: 10px 14px;
    background: var(--primary-soft);
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.3px;
}

.detail-table-row {
    display: grid;
    grid-template-columns: 1fr 50px 100px 100px;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid var(--border-light);
    font-size: 13px;
    color: var(--text);
    align-items: center;
}
.detail-table-row:hover { background: var(--primary-soft); }

.detail-qty { font-weight: 700; color: var(--text-secondary); text-align: center; }
.detail-subtotal { font-weight: 700; color: var(--primary); text-align: right; }

/* Payment grid inside detail */
.detail-payment-grid {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-8);
    overflow: hidden;
}

.detail-payment-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border-light);
    font-size: 14px;
    color: var(--text-secondary);
}
.detail-payment-row:last-child { border-bottom: none; }
.detail-payment-row span:last-child { font-weight: 600; color: var(--text); }

.detail-payment-total {
    background: var(--primary-soft);
    font-weight: 700 !important;
}
.detail-payment-total span { font-size: 15px; color: var(--primary) !important; }

.detail-discount { color: #DC2626 !important; }
.detail-change   { color: var(--success) !important; }

/* Info grid for service */
.detail-info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.detail-info-item {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-8);
    padding: 10px 14px;
}
.detail-info-item span  { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
.detail-info-item strong { font-size: 14px; color: var(--text); font-weight: 600; }

/* History type badges (keep old names for compat) */
.history-type {
    display: inline-block;
    padding: 4px 12px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 700;
}
.type-penjualan { background: var(--primary-light); color: var(--primary-dark); }
.type-servis    { background: #D1FAE5; color: #065F46; }

/* ============================================
   HISTORY FILTER & LIST
   ============================================ */
.tab-page-header { margin-bottom: var(--space-24); }
.tab-page-header h2 { font-size: 22px; font-weight: 700; color: var(--text); }

.history-list { display: grid; gap: var(--space-12); }

.filter-bar {
    display: flex;
    gap: var(--space-16);
    margin-bottom: var(--space-24);
    flex-wrap: wrap;
    align-items: flex-end;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-12);
    padding: var(--space-16);
}

.filter-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.filter-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.filter-group input,
.filter-group select {
    padding: 9px var(--space-12);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-8);
    font-size: 13px;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
    transition: all var(--transition-fast);
    min-width: 130px;
}
.filter-group input:focus,
.filter-group select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
